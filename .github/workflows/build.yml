name: Build with Pack

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.9.6

      - name: Build with Pack
        run: pack build python-inline-buildpack --path . --builder heroku/builder:24

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag python-inline-buildpack ghcr.io/${{ github.repository_owner }}/python-inline-buildpack:latest
          docker tag python-inline-buildpack ghcr.io/${{ github.repository_owner }}/python-inline-buildpack:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/python-inline-buildpack:latest
          docker push ghcr.io/${{ github.repository_owner }}/python-inline-buildpack:${{ github.sha }}
